name = "telegram-inbox"
main = "src/index.js"
compatibility_date = "2026-11-01"
workers_dev = true       # served at telegram-inbox.<account>.workers.dev
preview_urls = false     # no extra public URL per uploaded version

# Created with `npx wrangler kv namespace create INBOX`; paste the id it prints.
[[kv_namespaces]]
binding = "INBOX"
id = "deec5070093842a388a5a61c59a938e0"

# Secrets are never written here. Set them with `npx wrangler secret put <NAME>`:
#   TELEGRAM_SECRET  random string, also given to Telegram in setWebhook
#   INBOX_TOKEN      random string the agent sends as "Authorization: Bearer ..."
#   CHAT_ID          my Telegram chat id; messages from any other chat are dropped
